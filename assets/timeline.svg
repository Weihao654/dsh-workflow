<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="版本演进路线">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">版本演进：从“能跑”到“默认就好用”</text>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748b">每个版本都由同一套夹具、账本与回执验证；0.3.0 起默认工作流不再需要授权卡与预算。</text>

  <path d="M80 214h1040" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 1 -->
    <circle cx="140" cy="214" r="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="4"/>
    <text x="140" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">0.2.0-rc.1</text>
    <text x="140" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">2026-11-01</text>
    <text x="140" y="240" text-anchor="middle" font-size="12" fill="#64748b">受控轮次雏形</text>

    <!-- 2 -->
    <circle cx="340" cy="214" r="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="4"/>
    <text x="340" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">.38</text>
    <text x="340" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">11-06</text>
    <text x="340" y="240" text-anchor="middle" font-size="12" fill="#64748b">真实短作业通过</text>
    <text x="340" y="258" text-anchor="middle" font-size="11.5" fill="#b91c1c">关轮被预留门拒绝</text>

    <!-- 3 -->
    <circle cx="540" cy="214" r="10" fill="#ffffff" stroke="#67e8f9" stroke-width="4"/>
    <text x="540" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">.39</text>
    <text x="540" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">11-06</text>
    <text x="540" y="240" text-anchor="middle" font-size="12" fill="#64748b">关轮预留两承诺</text>
    <text x="540" y="258" text-anchor="middle" font-size="11.5" fill="#0e7490">槽位固定 · token 单调</text>

    <!-- 4 -->
    <circle cx="740" cy="214" r="10" fill="#ffffff" stroke="#67e8f9" stroke-width="4"/>
    <text x="740" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">.40</text>
    <text x="740" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">11-07</text>
    <text x="740" y="240" text-anchor="middle" font-size="12" fill="#64748b">profile 定位兼容</text>
    <text x="740" y="258" text-anchor="middle" font-size="11.5" fill="#0e7490">桌面宿主无需环境变量</text>

    <!-- 5 -->
    <circle cx="890" cy="214" r="10" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
    <text x="890" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">.40+scopefix.1</text>
    <text x="890" y="163" text-anchor="middle" font-size="11" fill="#94a3b8">11-07</text>
    <text x="890" y="240" text-anchor="middle" font-size="12" fill="#64748b">普通会话不再被误拦</text>
    <text x="890" y="258" text-anchor="middle" font-size="11.5" fill="#047857">作用域判定修正</text>

    <!-- 6 -->
    <circle cx="1080" cy="214" r="12" fill="#10b981"/>
    <rect x="986" y="104" width="188" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="1080" y="120" text-anchor="middle" font-size="10.5" fill="#047857">当前版本 · 209 例通过</text>
    <text x="1080" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">0.3.0-workflow</text>
    <text x="1080" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">11-07</text>
    <text x="1080" y="240" text-anchor="middle" font-size="12" fill="#047857">默认 plan 原生工作流</text>
    <text x="1080" y="258" text-anchor="middle" font-size="11.5" fill="#047857">无授权卡 · 无预算</text>

    <!-- legend -->
    <circle cx="66" cy="300" r="5" fill="#ffffff" stroke="#a5b4fc" stroke-width="3"/>
    <text x="80" y="304" font-size="11.5" fill="#64748b">早期受控轮次</text>
    <circle cx="206" cy="300" r="5" fill="#ffffff" stroke="#67e8f9" stroke-width="3"/>
    <text x="220" y="304" font-size="11.5" fill="#64748b">协议修正</text>
    <circle cx="306" cy="300" r="5" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <text x="320" y="304" font-size="11.5" fill="#64748b">作用域修正</text>
    <circle cx="406" cy="300" r="6" fill="#10b981"/>
    <text x="420" y="304" font-size="11.5" fill="#047857">当前版本（实心）</text>
  </g>

  <text x="52" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">显式受控轮次（.38–.40+scopefix）仍然保留：需要证据绑定、预算与可核验关轮时使用。</text>
  <text x="52" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">真实 Host/GUI 重载后的完整模型协作仍属未验证项，README 中如实标注。</text>
</svg>
