<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="两个包与宿主的关系">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0ea5e9"/>
    </marker>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">结构：两个包，一个宿主，一份工作区配置</text>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748b">两个包都是普通 DSH 插件，通过 profile bundle 启用；不修改宿主源码，也不需要单独进程。</text>

  <!-- L1 -->
  <g filter="url(#s3)"><rect x="60" y="200" width="300" height="180" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.6"/></g>
  <text x="82" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#312e81">L1 · 角色预设</text>
  <text x="82" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#6366f1">dsh-role-chain-presets 1.1.0</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#3730a3">
    <rect x="78" y="268" width="120" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="138" y="287" text-anchor="middle">plan</text>
    <rect x="210" y="268" width="130" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="275" y="287" text-anchor="middle">work</text>
    <rect x="78" y="304" width="120" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="138" y="323" text-anchor="middle">code</text>
    <rect x="210" y="304" width="130" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="275" y="323" text-anchor="middle">review</text>
  </g>
  <text x="82" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6366f1">bundle patch 注入 4 个 agent preset</text>

  <!-- Host -->
  <g filter="url(#s3)"><rect x="450" y="230" width="300" height="130" rx="18" fill="#0f172a"/></g>
  <text x="600" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">DeepSeek Harness</text>
  <text x="600" y="294" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94a3b8">会话 · 模型 · 工具注册 · Host 命令</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">
    <rect x="468" y="312" width="140" height="24" rx="12" fill="#1e293b"/>
    <text x="538" y="328" text-anchor="middle" fill="#a5b4fc">/chain-authorize</text>
    <rect x="620" y="312" width="114" height="24" rx="12" fill="#1e293b"/>
    <text x="677" y="328" text-anchor="middle" fill="#a5f3fc">14 个工具</text>
  </g>

  <!-- L2 -->
  <g filter="url(#s3)"><rect x="840" y="200" width="300" height="180" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.6"/></g>
  <text x="862" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#164e63">L2 · 轮次协议</text>
  <text x="862" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#0891b2">dsh-role-chain-protocol 0.3.0</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#155e75">
    <text x="862" y="280">controller / tools ── 门禁与工具面</text>
    <text x="862" y="304">usage / authorization ── 预算与授权</text>
    <text x="862" y="328">store ── 账本 / 回执 / 绑定</text>
    <text x="862" y="352">dispatch / jobs / bridge ── 隔离执行</text>
  </g>

  <!-- workspace -->
  <g filter="url(#s3)"><rect x="450" y="410" width="300" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/></g>
  <text x="600" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#1e293b">工作区持久化数据</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#475569">
    <text x="472" y="462">.dsh/role-chain.json ── 角色模型</text>
    <text x="472" y="486">role-chain-authority/ ── 账本与回执</text>
    <text x="472" y="510">test/run.mjs ── 21 文件 / 209 例</text>
  </g>

  <!-- arrows -->
  <path d="M364 290H446" stroke="#6366f1" stroke-width="2.2" marker-end="url(#b1)"/>
  <text x="405" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#4f46e5">提供角色</text>

  <path d="M836 290H754" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#b2)"/>
  <text x="795" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0369a1">注册工具</text>

  <path d="M600 364V406" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#b2)"/>
  <text x="612" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0369a1">读写</text>

  <text x="52" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">轮次账本按会话 cwd 定位，只在显式受控轮次中使用；默认工作流不需要它。</text>
</svg>
