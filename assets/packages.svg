<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="两个包与宿主的关系">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0ea5e9"/>
    </marker>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">结构：两个包，一个宿主，一份工作区配置</text>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748b">两个包都是普通 DSH 插件，通过 profile bundle 启用；不修改宿主源码，也不需要单独进程。</text>

  <!-- host -->
  <g filter="url(#s3)">
    <rect x="400" y="112" width="400" height="120" rx="18" fill="#0f172a"/>
  </g>
  <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#f8fafc">DeepSeek Harness</text>
  <text x="600" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#94a3b8">会话 · 模型 · 工具注册 · Host 命令</text>
  <rect x="432" y="192" width="150" height="26" rx="13" fill="#1e293b"/>
  <text x="507" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#a5b4fc">/chain-authorize</text>
  <rect x="594" y="192" width="130" height="26" rx="13" fill="#1e293b"/>
  <text x="659" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#a5f3fc">14 个 chain 工具</text>

  <!-- L1 -->
  <g filter="url(#s3)">
    <rect x="60" y="300" width="330" height="212" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.6"/>
  </g>
  <text x="84" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#312e81">dsh-role-chain-presets · L1</text>
  <text x="84" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4f46e5">只做“角色”，不含协议逻辑</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#3730a3">
    <rect x="84" y="376" width="282" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="96" y="396">plan   ── 规划 / 派发 / 汇总</text>
    <rect x="84" y="414" width="282" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="96" y="434">work   ── 协调 / 实施 / 回报</text>
    <rect x="84" y="452" width="282" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="96" y="472">code   ── 实现 / 验证</text>
    <rect x="84" y="490" width="282" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="96" y="510">review ── 独立评审</text>
  </g>
  <text x="84" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6366f1">bundle patch 注入 4 个 agent preset</text>

  <!-- L2 -->
  <g filter="url(#s3)">
    <rect x="810" y="300" width="330" height="212" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.6"/>
  </g>
  <text x="834" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#164e63">dsh-role-chain-protocol · L2</text>
  <text x="834" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0e7490">工具、预算、证据、关轮、隔离作业</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#155e75">
    <rect x="834" y="376" width="282" height="26" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="846" y="394">controller / tools ── 门禁与工具面</text>
    <rect x="834" y="410" width="282" height="26" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="846" y="428">usage / authorization ── 预算与授权</text>
    <rect x="834" y="444" width="282" height="26" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="846" y="462">store ── 账本 / 回执 / 会话绑定</text>
    <rect x="834" y="478" width="282" height="26" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="846" y="496">dispatch / managed-jobs / bridge</text>
  </g>
  <text x="834" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0891b2">Windows 上经 wsl.exe + bwrap 只读隔离执行</text>

  <path d="M330 200q40 80 90 120" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#b1)"/>
  <text x="286" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f46e5">提供角色</text>
  <path d="M870 200q-40 80-90 120" fill="none" stroke="#0ea5e9" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#b2)"/>
  <text x="872" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0369a1">注册工具 + 门禁</text>

  <!-- workspace data -->
  <g filter="url(#s3)">
    <rect x="400" y="300" width="400" height="212" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  </g>
  <text x="424" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1e293b">工作区里的持久化数据</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#334155">
    <rect x="424" y="356" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="438" y="376">.dsh/role-chain.json</text>
    <text x="438" y="393" font-size="11" fill="#64748b">角色 → provider / model / effort</text>
    <rect x="424" y="414" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="438" y="434">role-chain-authority/</text>
    <text x="438" y="451" font-size="11" fill="#64748b">账本 · 回执 · 授权 · 轮次（可核验）</text>
    <rect x="424" y="472" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="438" y="492">test/run.mjs</text>
    <text x="438" y="509" font-size="11" fill="#64748b">21 个夹具文件（209 例）+ api / routes</text>
  </g>
  <text x="424" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748b">轮次账本按会话 cwd 定位；默认工作流不需要它</text>

  <path d="M600 232v60" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#b2)"/>
</svg>
