<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="默认工作流：plan 协调多方完成闭环">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0ea5e9"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#10b981"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">默认工作流：plan 协调多方完成闭环</text>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748b">选择一个 <tspan font-weight="600" fill="#4f46e5">plan</tspan> 会话即可开始；work / code / review 由 plan 派发，不能直接对话。</text>

  <!-- user -->
  <g filter="url(#sh)">
    <rect x="60" y="250" width="170" height="96" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="145" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#334155">你</text>
  <text x="145" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#94a3b8">说需求 / 看结果</text>

  <!-- plan -->
  <g filter="url(#sh)">
    <rect x="430" y="130" width="300" height="110" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  </g>
  <text x="580" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#3730a3">plan · 规划角色</text>
  <text x="580" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6366f1">拆解任务 · 派发 · 汇总 · 交付</text>
  <text x="580" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#818cf8">唯一能对用户讲话的角色</text>

  <path d="M230 298H330q40 0 40-40V185q0-34 34-34h26" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">需求</text>

  <path d="M380 185q-34 0-34 34v112q0 40 40 40h44" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="352" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">交付</text>

  <!-- work -->
  <g filter="url(#sh)">
    <rect x="430" y="290" width="300" height="110" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="580" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#155e75">work · 协调角色</text>
  <text x="580" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0e7490">执行与汇总 · 可再派发 code / review</text>
  <text x="580" y="384" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#22d3ee">默认工作流中承担主要实施</text>

  <path d="M580 240v50" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arI)"/>
  <text x="596" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4f46e5">派发任务</text>

  <path d="M580 400v46" stroke="#0ea5e9" stroke-width="2.4" marker-start="url(#arC)" marker-end="url(#arC)"/>
  <text x="596" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0369a1">结果回到 work</text>

  <!-- code -->
  <g filter="url(#sh)">
    <rect x="170" y="450" width="260" height="104" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="300" y="494" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#065f46">code · 实现角色</text>
  <text x="300" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#059669">写代码 · 跑验证 · 回报结果</text>
  <text x="300" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#34d399">在独立子会话中工作</text>

  <!-- review -->
  <g filter="url(#sh)">
    <rect x="730" y="450" width="260" height="104" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="860" y="494" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#92400e">review · 评审角色</text>
  <text x="860" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#b45309">独立判断 · 给 verdict / scope</text>
  <text x="860" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#f59e0b">不带 plan 的上下文偏见</text>

  <path d="M500 375q-40 30-78 62" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arG)"/>
  <text x="398" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#059669">派发 code</text>

  <path d="M660 375q40 30 78 62" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arO)"/>
  <text x="700" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#b45309">请求评审</text>

  <path d="M430 470q-20-40 40-70" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arC)"/>
  <path d="M730 470q20-40-40-70" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arC)"/>

  <text x="52" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">默认工作流：无授权卡、无预算、13 个受控工具 scoped 隐藏；需要证据与关轮时再显式开启受控轮次。</text>
</svg>
