<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="默认工作流：plan 协调多方完成闭环">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">默认工作流：plan 协调多方完成闭环</text>
  <text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748b">选择一个 plan 会话即可开始；work / code / review 由 plan 派发，不能直接对话。</text>

  <!-- you -->
  <g filter="url(#sh)">
    <rect x="60" y="190" width="180" height="96" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="150" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#334155">你</text>
  <text x="150" y="257" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">说需求 / 看结果</text>

  <!-- plan -->
  <g filter="url(#sh)">
    <rect x="380" y="150" width="280" height="100" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  </g>
  <text x="520" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#3730a3">plan · 规划角色</text>
  <text x="520" y="213" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4f46e5">拆解 · 派发 · 汇总 · 交付</text>
  <text x="520" y="233" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#818cf8">唯一能对用户讲话的角色</text>

  <!-- work -->
  <g filter="url(#sh)">
    <rect x="380" y="330" width="280" height="100" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="520" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#155e75">work · 协调角色</text>
  <text x="520" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0e7490">执行 · 再派发 · 回收结果</text>
  <text x="520" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#22d3ee">同轮复用，不另起会话</text>

  <!-- code -->
  <g filter="url(#sh)">
    <rect x="150" y="480" width="230" height="96" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
  </g>
  <text x="265" y="518" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#065f46">code · 实现</text>
  <text x="265" y="542" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#059669">写代码 · 跑验证 · 回报</text>
  <text x="265" y="562" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#34d399">唯一可写角色</text>

  <!-- review -->
  <g filter="url(#sh)">
    <rect x="790" y="480" width="230" height="96" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.8"/>
  </g>
  <text x="905" y="518" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#92400e">review · 评审</text>
  <text x="905" y="542" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b45309">独立判断 · verdict / scope</text>
  <text x="905" y="562" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#f59e0b">每次新建 · 只读</text>

  <!-- arrows -->
  <path d="M240 210H376" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="308" y="197" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748b">需求 ⇄ 交付</text>

  <path d="M520 250V326" fill="none" stroke="#0ea5e9" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="534" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0369a1">派发 / 回报</text>

  <path d="M420 430V456H265V478" fill="none" stroke="#10b981" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="300" y="449" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#059669">派发 / 回收</text>

  <path d="M620 430V456H905V478" fill="none" stroke="#f59e0b" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="700" y="449" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b45309">请评审 / 回结果</text>

  <text x="52" y="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">箭头为双向：派发与回收。默认工作流无授权卡、无预算、13 个受控工具 scoped 隐藏；需要证据与关轮时再显式开启受控轮次。</text>
</svg>
